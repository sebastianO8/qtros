# HistData.com "Generic ASCII" one-minute bars (free download, histdata.com).
# Format: semicolon-separated, no header: YYYYMMDD HHMMSS;open;high;low;close;volume
# Time zone: America/New_York local time WITH daylight saving. HistData's own FAQ says
# "EST without daylight saving", but these AUD/JPY files contradict it: five US payrolls
# releases (08:30 New York local) spike at 08:30 on the file's clock in both summer and
# winter (2023-07-07, 2024-01-05, 2024-03-08, 2024-07-05, 2025-07-03), and Friday closes
# land at 16:59 year-round. A fixed-EST reading puts every summer bar one hour late.
# DST transitions fall on Sunday 02:00 while FX is closed, so STRICT_RAISE never fires on
# real rows; if it ever does, ingestion stops rather than guessing.
# Volume: HistData publishes 0 for every bar, meaning "not provided". It is deliberately
# NOT mapped, so the warehouse records volume as unknown (null) rather than zero.
# Aggregated to M5 once, at ingestion, because the strategies run on M5 bars.
schema_version: 1
source_id: histdata_audjpy_m1
instrument_id: AUDJPY
timeframe: M1
aggregate_to: M5
root_path: ./data_lake/raw/histdata_audjpy_m1
glob_pattern: "DAT_ASCII_AUDJPY_M1_*.csv"
file_format: CSV
columns:
  timestamp: column_1
  open: column_2
  high: column_3
  low: column_4
  close: column_5
timestamp_format: "%Y%m%d %H%M%S"
timestamp_policy: DECLARED_ZONE
declared_zone: America/New_York
dst_policy: STRICT_RAISE
timestamps_are_bar_open: true
csv_separator: ";"
has_header: false
recursive_glob: false
max_reject_ratio: "0.001"
# Coverage tolerance (PI ruling 2026-10-12): up to 5% of expected bars may be missing inside
# unexplained gaps before a run is refused. This was chosen AFTER the first run measured 4.4%
# missing on this data, so it is fitted to this data set; it is recorded here so that is
# visible. Gaps are still counted, logged, and written to results/<run_id>/coverage.json.
# Duplicates, impossible bars, and out-of-order rows are never tolerated.
max_missing_bar_fraction: "0.05"
