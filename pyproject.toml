#===============================================================================
# Quantitative Trading Research OS  —  build & tooling configuration
#
# Governed by Master Project Constitution v3.2 + ARCH-001/ARCH-002 PI rulings.
# Layer contracts in [tool.importlinter] are load-bearing: they convert the
# architectural rules from ARCH-001/002 into build failures rather than
# conventions. Do not relax a contract to make an import work — the import is
# the thing that is wrong.
#===============================================================================

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

#-------------------------------------------------------------------------------
# Project metadata & runtime dependencies
#-------------------------------------------------------------------------------
[project]
name = "qtros"
version = "0.1.0"
description = "Quantitative Trading Research OS — solo-PI research and validation pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Principal Investigator" }]

# Upper bounds are deliberate. Polars and DuckDB both ship breaking changes on a
# fast cadence; Directive 10 (run provenance) is meaningless if the data layer
# can drift underneath an archived manifest.
dependencies = [
    "numpy>=1.26,<3.0",           # exact IEEE-754 bytes for dataset fingerprinting (A-2)
    "polars>=1.9,<2.0",           # Layer 0/0.5 vectorized frames
    "duckdb>=1.1,<2.0",           # Layer 0 warehouse — imported ONLY by qtros.data.store
    "pyarrow>=17.0,<22.0",        # DuckDB <-> Polars interchange (store.insert_bars / query_bars); not imported directly
    "pydantic>=2.9,<3.0",         # configuration schema
    "pydantic-settings>=2.5,<3.0",# .env secrets (Phase 4 webhooks); never YAML
    "pyyaml>=6.0,<7.0",           # config files (Decimal fields MUST be quoted — see D-2)
    "structlog>=24.4,<26.0",      # mandate §2: zero print statements
    "jinja2>=3.1,<4.0",           # Layer 5 report rendering (not thinned, per PI ruling)
    "altair>=5.4,<6.0",           # Vega-Lite JSON charts — deterministic, no browser deps
    "typer>=0.12,<1.0",           # thin CLI shell over the engine
    "typing-extensions>=4.12",
]

# Phase 3 is explicitly optional under the constitution. Keep a Phase 1 install
# small: skipping Phase 3 entirely is a named successful outcome.
[project.optional-dependencies]
ml = [
    "xgboost>=2.1,<4.0",
    "scikit-learn>=1.5,<2.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-xdist>=3.6",          # parallel runs keep the evening suite usable
    "hypothesis>=6.112,<7.0",     # property-based OHLC / fill edge cases
    "mypy>=1.13,<2.0",
    "ruff>=0.7,<1.0",
    "import-linter>=2.1,<3.0",
    "pre-commit>=4.0,<5.0",
    "types-PyYAML",
]

[project.scripts]
qtros = "qtros.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qtros"]

#-------------------------------------------------------------------------------
# Ruff — lint + format. Replaces black, isort, and flake8.
#-------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes core
    "I",             # import sorting
    "N",             # PEP-8 naming
    "UP",            # pyupgrade
    "ANN",           # missing annotations — mandate §2 requires type hints
    "D",             # docstrings — mandate §2 requires Google style
    "B",             # bugbear (mutable defaults, loop-variable binding)
    "SIM",           # simplification
    "PTH",           # pathlib over os.path
    "DTZ",           # naive datetime detection — THE Cycle 1 lesson as a lint rule
    "T20",           # no print / pprint — mandate §2
    "RET", "ARG", "TCH", "RUF",
]
ignore = [
    "D107",   # __init__ docstring — covered by class docstring
    "ANN401", # Any in *args/**kwargs at framework boundaries
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Pydantic evaluates field annotations at runtime, so imports used only in annotations
# of config models must NOT be moved into TYPE_CHECKING blocks.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "qtros.configuration.models.base.QtrosConfig"]
strict = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "ARG"]   # test names document themselves
"src/qtros/domain/enums.py" = ["D101", "D102"]
"src/qtros/cli.py" = ["TC"]        # typer evaluates Annotated[...] at runtime; imports must stay live
"scripts/**" = ["T201"]            # operator scripts speak through stdout by design

[tool.ruff.format]
docstring-code-format = true

#-------------------------------------------------------------------------------
# Mypy — strict everywhere, strictest in domain/
#-------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true            # dead branches in risk-limit logic are dangerous
warn_return_any = true
disallow_untyped_decorators = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

# domain/ is the contract core: no escape hatches.
[[tool.mypy.overrides]]
module = "qtros.domain.*"
disallow_any_explicit = true

# Polars/DuckDB typing at the boundary is imperfect; contained, not global.
[[tool.mypy.overrides]]
module = ["polars.*", "duckdb.*", "altair.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

#-------------------------------------------------------------------------------
# Pytest
#-------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config -m 'not slow'"
markers = [
    "slow: multi-year or full-pipeline runs (excluded from the default run)",
    "integration: crosses a layer boundary",
    "regression: pins a Cycle 1 empirical lesson — never delete one of these",
    "property: hypothesis-generated inputs",
]
filterwarnings = ["error"]         # a warning you ignore is a bug you ship

#-------------------------------------------------------------------------------
# Import Linter — ARCH-001/002 architecture as build failures
#-------------------------------------------------------------------------------
[tool.importlinter]
root_package = "qtros"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture — imports point one way only"
type = "layers"
layers = [
    "qtros.cli",
    "qtros.workflow",
    "qtros.analytics | qtros.persistence",
    "qtros.engine",
    "qtros.execution",
    "qtros.risk",
    "qtros.alpha",
    "qtros.features",
    "qtros.data",
    "qtros.configuration",
    "qtros.domain",
]

[[tool.importlinter.contracts]]
name = "domain/ depends on nothing internal (Polars excepted as the frame type)"
type = "forbidden"
source_modules = ["qtros.domain"]
forbidden_modules = [
    "qtros.configuration", "qtros.data", "qtros.features", "qtros.alpha",
    "qtros.risk", "qtros.execution", "qtros.engine", "qtros.analytics",
    "qtros.persistence", "qtros.portfolio", "qtros.regime",
    "duckdb", "pydantic", "yaml",
]

[[tool.importlinter.contracts]]
name = "One door to the warehouse — only data.store may import duckdb"
type = "forbidden"
source_modules = [
    "qtros.features", "qtros.alpha", "qtros.risk", "qtros.execution",
    "qtros.engine", "qtros.analytics", "qtros.persistence", "qtros.configuration",
]
forbidden_modules = ["duckdb"]

[[tool.importlinter.contracts]]
name = "One door to the filesystem — Cycle 1 self-ingestion guard"
type = "forbidden"
source_modules = [
    "qtros.features", "qtros.alpha", "qtros.risk", "qtros.execution",
    "qtros.engine", "qtros.analytics", "qtros.domain",
]
forbidden_modules = ["csv", "glob", "shutil"]

[[tool.importlinter.contracts]]
name = "Config describes, never executes"
type = "forbidden"
source_modules = ["qtros.configuration"]
forbidden_modules = [
    "qtros.data", "qtros.features", "qtros.alpha", "qtros.risk",
    "qtros.execution", "qtros.engine", "qtros.analytics",
]

[[tool.importlinter.contracts]]
name = "Strategies are mutually independent (protects the Phase 2 correlation check)"
type = "independence"
modules = [
    "qtros.alpha.strategies.vwap_pullback",
    # audjpy_asian_sweep: add here when the Phase 2 strategy module lands
]

[[tool.importlinter.contracts]]
name = "Phase 3 ML stays optional — no core package may import xgboost"
type = "forbidden"
source_modules = [
    "qtros.domain", "qtros.configuration", "qtros.data", "qtros.features",
    "qtros.alpha", "qtros.risk", "qtros.execution", "qtros.engine",
]
forbidden_modules = ["xgboost", "sklearn"]